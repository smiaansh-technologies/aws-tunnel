name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write  # for uploading release assets

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            artifact_name: aws-tunnel-windows-x86_64.exe
            spec_args: "--clean --onefile --windowed --name aws-tunnel --add-data docs;docs main.py"
          - os: ubuntu-latest
            arch: x86_64
            artifact_name: aws-tunnel-linux-x86_64
            spec_args: "--clean --onefile --windowed --name aws-tunnel --add-data docs:docs main.py"
            pre: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends python3-tk libxkbcommon-x11-0 libegl1 libdbus-1-3 libxcb-cursor0 libxcb-xinerama0 libxkbcommon0 libgl1 libxcomposite1 libxcursor1 libxdamage1 libxfixes3 libxi6 libxrender1 libxtst6 libasound2 libpulse0 libappindicator3-1 gir1.2-appindicator3-0.1
          - os: macos-latest
            arch: x86_64
            artifact_name: aws-tunnel-macos-x86_64
            spec_args: "--clean --onefile --windowed --name aws-tunnel --add-data docs:docs main.py"
          - os: macos-15-arm64
            arch: arm64
            artifact_name: aws-tunnel-macos-arm64
            spec_args: "--clean --onefile --windowed --name aws-tunnel --add-data docs:docs main.py"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: (Linux) Install system libraries for Tk / AppIndicator tray
        if: runner.os == 'Linux'
        run: ${{ matrix.pre }}

      - name: Install Python + deps
        run: |
          uv python install 3.12
          uv sync --group dev

      - name: Run tests
        run: uv run --group test pytest -q

      - name: Build binary with PyInstaller (use repo spec on Windows, CLI args elsewhere for semicolon vs colon)
        shell: bash
        run: |
          if [ "${RUNNER_OS}" = "Windows" ]; then
            uv run --group dev pyinstaller --clean aws-tunnel.spec
          else
            uv run --group dev pyinstaller ${{ matrix.spec_args }}
          fi

      - name: Locate binary and rename to per-OS artifact
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          src=""
          if [ "${RUNNER_OS}" = "Windows" ]; then
            src="dist/aws-tunnel.exe"
          elif [ "${RUNNER_OS}" = "macOS" ]; then
            src="dist/aws-tunnel"
          else
            src="dist/aws-tunnel"
          fi
          [ -f "$src" ] || { echo "Binary not found at $src"; ls -la dist/; exit 1; }
          dest="dist/${{ matrix.artifact_name }}"
          mv "$src" "$dest"
          echo "artifact=$dest" >> $GITHUB_OUTPUT
          ls -la "$dest"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.binary.outputs.artifact }}
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false