name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64 — uses the versioned spec (console=False + docs bundle).
          - os: windows-latest
            artifact_name: aws-tunnel-windows-x86_64.exe
          # Linux x86_64 (Ubuntu 24.04 / Noble). Pin 24.04 so apt package names stay stable.
          - os: ubuntu-24.04
            artifact_name: aws-tunnel-linux-x86_64
          # macOS Apple Silicon — macos-latest is arm64, not Intel.
          - os: macos-latest
            artifact_name: aws-tunnel-macos-arm64
          # macOS Intel — standard hosted runner (macos-15-arm64 is not a valid label).
          - os: macos-15-intel
            artifact_name: aws-tunnel-macos-x86_64

    steps:
      - uses: actions/checkout@v5

      # python.org builds (via setup-python) ship Tcl/Tk. uv's standalone
      # CPython and Homebrew python@3.14 on macOS runners often do not,
      # which breaks both GUI tests and the PyInstaller binary.
      - name: Set up Python 3.12 (official, with Tcl/Tk)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"

      - name: (Linux) Install Tk / tray / xvfb system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk \
            libtk8.6 \
            tcl8.6 \
            xvfb \
            libxkbcommon-x11-0 \
            libegl1 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxkbcommon0 \
            libgl1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxfixes3 \
            libxi6 \
            libxrender1 \
            libxtst6 \
            libasound2t64 \
            libpulse0 \
            libayatana-appindicator3-1 \
            gir1.2-ayatanaappindicator3-0.1

      - name: Verify tkinter is importable
        run: python -c "import tkinter; print('tk', tkinter.TkVersion)"

      - name: Install project + build/test extras
        run: uv sync --python 3.12 --group dev --group test

      - name: Run tests
        if: runner.os != 'Linux'
        run: uv run --python 3.12 --group test pytest -q

      - name: Run tests (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --python 3.12 --group test pytest -q

      - name: Build binary with PyInstaller
        run: uv run --python 3.12 --group dev pyinstaller --clean --noconfirm aws-tunnel.spec

      - name: Locate binary and rename to per-OS artifact
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            src="dist/aws-tunnel.exe"
          else
            src="dist/aws-tunnel"
          fi
          [ -f "$src" ] || { echo "Binary not found at $src"; ls -la dist/ || true; exit 1; }
          dest="dist/${{ matrix.artifact_name }}"
          mv "$src" "$dest"
          echo "artifact=$dest" >> "$GITHUB_OUTPUT"
          ls -la "$dest"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ steps.binary.outputs.artifact }}
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
